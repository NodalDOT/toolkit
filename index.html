<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/showcase/ui/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/showcase/ui/fonts/JetBrainsMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/showcase/ui/styles/index.css" />

    <title>Toolkit</title>
  </head>
  <body data-theme="dark" data-sidebar="expanded">
    <template data-html-script="restore-state"></template>
    <main>
      <aside>
        <div class="sidebar-toolbar">
          <strong class="sidebar-title">Toolkit</strong>
          <div class="sidebar-actions">
            <button
              class="icon-button nav-fold-toggle"
              type="button"
              aria-label="Collapse all groups"
            >
              <span class="icon nav-fold-icon" aria-hidden="true">
                <template data-html-icon="fold"></template>
              </span>
            </button>
            <button
              class="icon-button sidebar-toggle sidebar-toggle-aside"
              type="button"
              aria-label="Hide sidebar"
              title="Hide sidebar"
            >
              <span class="icon" aria-hidden="true">
                <template data-html-icon="sidebar"></template>
              </span>
            </button>
          </div>
        </div>
        <div class="sidebar-content">
          <input
            class="nav-filter"
            type="search"
            placeholder="Filter…"
            aria-label="Filter items"
            autocomplete="off"
          />
          <nav>
            <template data-html-each="catalog">
              <details class="nav-group nav-section" data-key="{{ path }}" open>
                <summary class="nav-group-summary">
                  <span class="nav-chevron" aria-hidden="true"></span>
                  <span class="nav-group-title">{{ title }}</span>
                </summary>
                <template data-html-each="categories">
                  <details
                    class="nav-group nav-category"
                    data-key="{{ path }}"
                    open
                  >
                    <summary class="nav-group-summary">
                      <span class="nav-chevron" aria-hidden="true"></span>
                      <span class="nav-group-title">{{ title }}</span>
                      <span class="nav-group-count">{{ count }}</span>
                    </summary>
                    <ul>
                      <template data-html-each="items">
                        <li>
                          <button
                            class="nav-item"
                            type="button"
                            data-path="{{ path }}"
                            data-title="{{ title }}"
                          >
                            <span class="nav-item-label">{{ title }}</span>
                          </button>
                        </li>
                      </template>
                    </ul>
                  </details>
                </template>
              </details>
            </template>
            <p class="nav-empty" hidden>Nothing found</p>
          </nav>
          <template data-html-script="restore-groups"></template>
        </div>
      </aside>
      <div class="workspace">
        <header>
          <div class="header-start">
            <button
              class="icon-button sidebar-toggle sidebar-toggle-header"
              type="button"
              aria-label="Show sidebar"
              title="Show sidebar"
            >
              <span class="icon" aria-hidden="true">
                <template data-html-icon="sidebar"></template>
              </span>
            </button>
            <strong class="header-title">Toolkit</strong>
          </div>
          <a
            class="header-center"
            href="%GITHUB_URL%"
            target="_blank"
            rel="noreferrer"
            >%GITHUB_NAME%</a
          >
          <button
            class="icon-button theme-toggle"
            type="button"
            aria-label="Toggle theme"
          >
            <span class="icon theme-icon-sun" aria-hidden="true">
              <template data-html-icon="sun"></template>
            </span>
            <span class="icon theme-icon-moon" aria-hidden="true">
              <template data-html-icon="moon"></template>
            </span>
          </button>
        </header>
        <iframe id="preview" title="Snippet preview"></iframe>
      </div>
    </main>
    <script type="module" src="/showcase/ui/scripts/main.js"></script>
  </body>
</html>
