<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <title>Toolkit</title>
</head>
<body data-theme="dark" data-sidebar="expanded">
    <header>
        <button class="sidebar-toggle sidebar-toggle-header" type="button" aria-label="Expand sidebar">
            <span class="sidebar-toggle-icon" aria-hidden="true">&#9776;</span>
        </button>
        <strong class="header-title">Toolkit</strong>
        <a class="header-center" href="<%= githubUrl %>" target="_blank" rel="noreferrer"><%= githubName %></a>
        <button class="theme-toggle" type="button" aria-label="Toggle theme">
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2.5"></path>
                    <path d="M12 19.5V22"></path>
                    <path d="M2 12h2.5"></path>
                    <path d="M19.5 12H22"></path>
                    <path d="m4.9 4.9 1.8 1.8"></path>
                    <path d="m17.3 17.3 1.8 1.8"></path>
                    <path d="m17.3 6.7 1.8-1.8"></path>
                    <path d="m4.9 19.1 1.8-1.8"></path>
                </svg>
            </span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
                </svg>
            </span>
        </button>
    </header>
    <main>
        <aside>
            <div class="sidebar-toolbar">
                <span class="sidebar-title">Components</span>
                <button class="sidebar-toggle sidebar-toggle-aside" type="button" aria-label="Collapse sidebar">
                    <span class="sidebar-toggle-icon" aria-hidden="true">&lsaquo;</span>
                </button>
            </div>
            <div class="sidebar-content">
            <% for (const [blockKey, block] of Object.entries(structure)) { %>
            <h2 class="sidebar-group-title"><%= block.name %></h2>
            <ul>
      <% for (const element of block.elements) { %>
        <li>
          <button
            class="nav-item"
            data-component="<%= blockKey %>"
            data-element="<%= element.name %>"
          >
            <span class="nav-item-label"><%= element.name %></span>
          </button>
        </li>
      <% } %>
    </ul>
            <% } %>
            </div>
        </aside>
        <section>
            <iframe id="preview"></iframe>
        </section>
    </main>
    <script src="./script.js" defer></script>
</body>
</html>
