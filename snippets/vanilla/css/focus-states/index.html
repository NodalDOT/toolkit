<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Focus states</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Focus states</h1>

      <section class="focus-demo" aria-label="Double focus ring">
        <p>
          Switch themes and press Tab. The ring has a white outline and a black
          outer shadow.
        </p>

        <label class="focus-demo__theme" for="focus-dark-theme">
          <input id="focus-dark-theme" type="checkbox" />
          Dark preview
        </label>

        <form class="focus-demo__form" aria-labelledby="contact-details">
          <h2 id="contact-details">Contact details</h2>

          <div class="focus-demo__field">
            <label for="contact-name">Name</label>
            <input id="contact-name" type="text" autocomplete="name" />
          </div>

          <div class="focus-demo__field">
            <label for="contact-email">Email</label>
            <input id="contact-email" type="email" autocomplete="email" />
          </div>

          <button type="reset">Reset</button>
        </form>
      </section>
    </main>
  </body>
</html>
