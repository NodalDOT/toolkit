<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Text wrap</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Text wrap</h1>

      <div class="wrap-demo">
        <label class="wrap-toggle">
          <input type="checkbox" />
          Enable balanced and pretty wrapping
        </label>

        <section class="wrap-example">
          <h2><code>text-wrap: balance</code></h2>
          <h3>Small changes make articles easier to read</h3>
        </section>

        <section class="wrap-example">
          <h2><code>text-wrap: pretty</code></h2>
          <p>
            A clear headline helps readers find what they need. A thoughtful
            layout makes the rest of the page easier to scan on smaller screens.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
