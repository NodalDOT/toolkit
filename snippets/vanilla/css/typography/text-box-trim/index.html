<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Text box trim</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Text box trim</h1>

      <div class="trim-comparison">
        <section class="trim-example">
          <h2>Default text box</h2>
          <div class="badge">
            <p class="badge-text">READY</p>
          </div>
        </section>

        <section class="trim-example">
          <h2>Trimmed text box</h2>
          <div class="badge">
            <p class="badge-text trimmed">READY</p>
          </div>
        </section>
      </div>

      <p class="trim-fallback">
        This browser uses default text spacing for both samples.
      </p>
    </main>
  </body>
</html>
