<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Subgrid</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Subgrid</h1>

      <div class="subgrid-demo">
        <label class="subgrid-toggle">
          <input type="checkbox" checked />
          Align card rows with subgrid
        </label>

        <div class="card-grid">
          <article class="card">
            <h2>Starter</h2>
            <p>Plan your own work with a personal task board.</p>
            <footer>Free</footer>
          </article>

          <article class="card">
            <h2>Team planning and collaboration</h2>
            <p>Share boards and assign tasks across your team.</p>
            <footer>$12 / month</footer>
          </article>

          <article class="card">
            <h2>Studio</h2>
            <p>
              Manage work across multiple teams with shared calendars, project
              templates, and reports for every workspace.
            </p>
            <footer>$24 / month</footer>
          </article>
        </div>
      </div>
    </main>
  </body>
</html>
