<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Entry transitions</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">@starting-style</h1>

      <div class="callout-demo">
        <label class="callout-toggle">
          <input type="checkbox" aria-controls="save-message" />
          Show confirmation
        </label>

        <p class="callout" id="save-message">Your changes were saved.</p>
      </div>
    </main>
  </body>
</html>
