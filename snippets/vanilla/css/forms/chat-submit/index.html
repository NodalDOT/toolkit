<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Chat send button</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Chat send button</h1>

      <div class="chat-demo">
        <div
          class="chat-history"
          role="log"
          aria-label="Sent messages"
          tabindex="0"
        >
          <p class="chat-empty">No messages yet.</p>
        </div>

        <form class="chat-form">
          <label for="message">Message</label>
          <div class="chat-composer snippet-controls">
            <input
              id="message"
              type="text"
              placeholder="Type a message"
              autocomplete="off"
              required
            />
            <button type="submit" disabled>Send</button>
          </div>
        </form>
      </div>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
