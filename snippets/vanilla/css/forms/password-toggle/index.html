<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Password visibility toggle</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">Password toggle</h1>

      <div class="password-demo">
        <label for="password">Password</label>

        <div class="password-control">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Type a sample password"
          />
          <button type="button" aria-controls="password" hidden>
            Show password
          </button>
        </div>

        <p>
          The button sits beside the input, leaving its right edge free for a
          password manager icon.
        </p>
      </div>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
