<!doctype html>
<html lang="en">
  <head>
    <template data-html-content="snippet-head"></template>
    <link rel="stylesheet" href="./style.css" />
    <title>Intrinsic size transitions</title>
  </head>
  <body data-theme="%DEFAULT_THEME%">
    <template data-html-script="snippet-theme"></template>
    <main class="snippet">
      <h1 class="snippet-title">interpolate-size</h1>

      <details class="size-demo">
        <summary>Trip details</summary>
        <p class="trip-details">
          Meet at the north trailhead at 9 a.m. Bring water and a light jacket.
          The route follows the river before climbing to the lookout.
        </p>
      </details>
    </main>
  </body>
</html>
